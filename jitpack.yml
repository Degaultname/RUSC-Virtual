jdk:
  - openjdk11

before_install:
  - sdkmanager "platforms;android-29" "build-tools;29.0.3"
  - wget -q https://services.gradle.org/distributions/gradle-6.5-bin.zip -O /tmp/gradle-6.5-bin.zip
  - unzip -qo /tmp/gradle-6.5-bin.zip -d /tmp

install:
  - sed -i 's/jcenter()/mavenCentral()/g' build.gradle
  - /tmp/gradle-6.5/bin/gradle :limbo-android-lib:publishReleasePublicationToMavenLocal --no-daemon
