
name: Preparar RUSC Virtual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar-limbo:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir repositorio
        uses: actions/checkout@v4

      - name: Baixar codigo do Limbo
        run: |
          git clone --depth 1 \
            https://github.com/limboemu/limbo.git \
            /tmp/limbo
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/limbo/ ./

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "RUSC Bot"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Importar codigo-fonte Limbo"
            git push
          fi
