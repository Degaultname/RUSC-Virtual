name: Compilar RUSC Virtual (base Limbo)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Configurar Gradle 6.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.5'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 29
        run: sdkmanager "platforms;android-29" "build-tools;29.0.3"

      - name: Ajustar repositorios descontinuados
        run: sed -i 's/jcenter()/mavenCentral()/g' build.gradle

      - name: Compilar aplicativo-base
        run: gradle :limbo-android-arm:assembleDebug --no-daemon --stacktrace

      - name: Guardar APK de teste
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RUSC-Virtual-base-debug
          path: limbo-android-arm/build/outputs/apk/debug/*.apk
          if-no-files-found: error
